<div id="registerModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        <div class="bg-brandBlue text-white p-5 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-lg">Book Wash Slot</h3>
                <p class="text-xs text-blue-200">Register details to receive instant WhatsApp slot confirmation</p>
            </div>
            <button onclick="closeRegisterModal()" class="text-blue-200 hover:text-white">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <form onsubmit="handleCustomerRegistration(event)" class="p-6 overflow-y-auto space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Customer Name *</label>
                <input type="text" id="custName" required placeholder="e.g. Demo User" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Vehicle Model *</label>
                    <input type="text" id="custVehicle" required placeholder="e.g. TVS Jupiter / Creta" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Vehicle Registration No. *</label>
                    <input type="text" id="custRegNo" required placeholder="e.g. MH17BF2603" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contact Number *</label>
                <input type="tel" id="custPhone" required placeholder="e.g. 9325168822" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Preferred Date *</label>
                    <input type="date" id="custDate" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Preferred Time Slot *</label>
                    <select id="custSlot" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
                        <option value="Morning (08:00 AM - 11:00 AM)">Morning (08:00 AM - 11:00 AM)</option>
                        <option value="Afternoon (11:00 AM - 03:00 PM)">Afternoon (11:00 AM - 03:00 PM)</option>
                        <option value="Evening (03:00 PM - 07:00 PM)">Evening (03:00 PM - 07:00 PM)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Native Address / Village *</label>
                <input type="text" id="custAddress" required placeholder="e.g. Sangamner / Sukewadi" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Service Required</label>
                <select id="custService" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
                    <option>Top Foam Wash</option>
                    <option>Full Wash + Vacuuming</option>
                    <option>Tractor Wash + Tire Ballast Filling</option>
                    <option>Commercial Truck / Heavy Wash</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-brandOrange hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-4">
                <i data-lucide="message-square" class="w-5 h-5"></i> Send Request via WhatsApp
            </button>
        </form>
    </div>
</div>

<script>
    // Set minimum date selector to today automatically on page load
    document.addEventListener("DOMContentLoaded", function() {
        const dateInput = document.getElementById('custDate');
        if (dateInput) {
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
            dateInput.value = today; // Default to today
        }
    });

    // Updated Customer Registration & WhatsApp Handler with Date
    function handleCustomerRegistration(e) {
        e.preventDefault();

        const name = document.getElementById('custName').value;
        const vehicle = document.getElementById('custVehicle').value;
        const regNo = document.getElementById('custRegNo').value;
        const phone = document.getElementById('custPhone').value;
        const rawDate = document.getElementById('custDate').value;
        const slot = document.getElementById('custSlot').value;
        const address = document.getElementById('custAddress').value;
        const service = document.getElementById('custService').value;

        // Format Date for cleaner reading
        const dateObj = new Date(rawDate);
        const formattedDate = dateObj.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

        // Save to Admin Session State
        customerBookings.unshift({ 
            name, vehicle, regNo, phone, date: formattedDate, slot, address, service, time: new Date().toLocaleTimeString() 
        });
        if (typeof renderAdminBookings === 'function') {
            renderAdminBookings();
        }

        // Construct pre-filled WhatsApp Message with Date & Time
        const whatsappMsg = `Jai Hind Gajraj Team! I want to book a vehicle wash slot.%0A%0A` +
            `*Customer Name:* ${encodeURIComponent(name)}%0A` +
            `*Vehicle Model:* ${encodeURIComponent(vehicle)}%0A` +
            `*Registration No:* ${encodeURIComponent(regNo)}%0A` +
            `*Phone:* ${encodeURIComponent(phone)}%0A` +
            `*Address:* ${encodeURIComponent(address)}%0A` +
            `*Service:* ${encodeURIComponent(service)}%0A` +
            `*Requested Date:* ${encodeURIComponent(formattedDate)}%0A` +
            `*Preferred Slot:* ${encodeURIComponent(slot)}%0A%0A` +
            `Please confirm slot availability.`;

        // Redirect to WhatsApp
        window.open(`https://wa.me/919637812928?text=${whatsappMsg}`, '_blank');
        closeRegisterModal();
    }
</script>
